<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Say Game</title>
    <link rel="stylesheet" href="simon-say.css">
    <script src="simon-say.js" defer></script>
</head>
<body>
    <h1>Simon Say Game</h1>
    <h2>Press any key to start the game</h2>
    <div class="btn-containor">
        <div class="line-one">
            <div class="red btn" type="button" id="red"></div>
            <div class="yellow btn" type="button" id="yellow"></div>
        </div>
        <div class="line-two">
            <div class="green btn" type="button" id="green"></div>
            <div class="blue btn" type="button" id="blue"></div>
        </div>
        
    </div>
</body>
</html>
