<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h2 {
            margin: 20px 0 10px 0;
            color: #333;
        }

        /* EXAMPLE 1: Basic Flexbox Row */
        .container-1 {
            display: flex;
            background-color: #e8f4f8;
            padding: 20px;
            gap: 10px;
            margin: 20px;
        }

        .box {
            background-color: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
            flex: 1;
            border-radius: 5px;
        }

        /* EXAMPLE 2: Flex Direction Column */
        .container-2 {
            display: flex;
            flex-direction: column;
            background-color: #fff3cd;
            padding: 20px;
            gap: 10px;
            margin: 20px;
        }

        /* EXAMPLE 3: Justify Content */
        .container-3 {
            display: flex;
            justify-content: space-around;
            background-color: #f8d7da;
            padding: 20px;
            gap: 10px;
            margin: 20px;
        }

        /* EXAMPLE 4: Align Items */
        .container-4 {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            background-color: #d4edda;
            margin: 20px;
        }

        .center-box {
            background-color: #28a745;
            color: white;
            padding: 30px;
            font-size: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Flexbox Practice Examples</h1>

    <h2>Example 1: Basic Row (Equal Width)</h2>
    <div class="container-1">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

    <h2>Example 2: Column Layout</h2>
    <div class="container-2">
        <div class="box">Item 1</div>
        <div class="box">Item 2</div>
        <div class="box">Item 3</div>
    </div>

    <h2>Example 3: Space Around</h2>
    <div class="container-3">
        <div class="box" style="flex: 0;">Short</div>
        <div class="box" style="flex: 0;">Medium Box</div>
        <div class="box" style="flex: 0;">Longer Box</div>
    </div>

    <h2>Example 4: Center Everything</h2>
    <div class="container-4">
        <div class="center-box">Centered Content!</div>
    </div>
</body>
</html>
