<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      background: #1a1a2e;
    }
    
    .logo {
      color: white;
      font-size: 20px;
      font-weight: bold;
    }
    
    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }
    
    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 15px;
      transition: color 0.2s;
    }
    
    .nav-links a:hover { color: #a855f7; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">YourName</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
